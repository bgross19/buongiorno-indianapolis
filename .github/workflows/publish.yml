name: Publish Daily Italian Podcast

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: "America/Indiana/Indianapolis"
    - cron: "47 4 * * *"
      timezone: "America/Indiana/Indianapolis"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - name: Fetch scripts and build RSS feed
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/build_feed.py
      - name: Commit and push new episodes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ feed.xml
          git diff --staged --quiet || (git commit -m "Add daily podcast episode" && git push)
