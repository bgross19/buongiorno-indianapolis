name: Publish Daily Italian Podcast

on:
  schedule:
    - cron: "33 4 * * *"
      timezone: "America/Indiana/Indianapolis"
    - cron: "7 5 * * *"
      timezone: "America/Indiana/Indianapolis"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-daily-italian-podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - name: Fetch scripts and build RSS feed
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python scripts/build_feed.py
      - name: Commit and push new episodes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes/ feed.xml
          if ! git diff --staged --quiet; then
            git commit -m "Add daily podcast episode"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
